<!-- Source for assets/og.png (1200×630). Regenerate with `npm run og`; needs Google Chrome and a network connection for the web fonts. -->
<!doctype html><html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0}
  body{width:1200px;height:630px;overflow:hidden;background:#d9d3c8;color:#1b1916;font-family:"Manrope",sans-serif;position:relative;-webkit-font-smoothing:antialiased}
  .rule{position:absolute;left:72px;right:72px;top:64px;height:1px;background:rgba(27,25,22,.3)}
  .label{position:absolute;left:72px;top:80px;font:500 15px/1 "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(27,25,22,.68)}
  .label b{color:#9d5f12;font-weight:500}
  .name{position:absolute;left:68px;top:206px;margin:0;font:400 96px/1 "Newsreader",Georgia,serif;letter-spacing:-.02em}
  .line{position:absolute;left:72px;top:330px;margin:0;font:italic 400 40px/1.2 "Newsreader",Georgia,serif;color:#9d5f12}
  .line u{text-decoration:none;position:relative}
  .line u svg{position:absolute;left:0;right:0;bottom:-10px;width:100%;height:12px;overflow:visible}
  .foot{position:absolute;left:72px;top:520px;font:400 19px/1.5 "Manrope",sans-serif;color:rgba(27,25,22,.68);max-width:640px}
  .frame{position:absolute;right:104px;top:96px;width:312px;height:390px;transform:rotate(2.5deg)}
  .frame::before{content:"";position:absolute;inset:0;transform:translate(22px,22px);background:rgba(157,95,18,.34);border-radius:10px}
  .frame img{position:relative;width:100%;height:100%;object-fit:cover;border-radius:10px;border:1px solid rgba(27,25,22,.14);background:#cdc6b9}

<div class="rule"></div>
<p class="label">Warren Township High School &nbsp;·&nbsp; Class of 2027 &nbsp;·&nbsp; <b>Portfolio</b></p>
<h1 class="name">Kaliph Howard</h1>
<p class="line">People, ideas, and <u>follow-through.<svg viewBox="0 0 100 12" preserveAspectRatio="none"><path d="M1 8 C 20 2, 40 11, 60 5 S 90 3, 99 7" fill="none" stroke="#9d5f12" stroke-width="2.2" stroke-linecap="round"/></svg></u></p>
<p class="foot">Student leadership, Black community, business, and technology.<br>A portfolio for college admissions.</p>
<div class="frame"><img src="../assets/kaliph-howard.jpg" alt=""></div>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe6d6"/>
      <stop offset="0.55" stop-color="#e2d6c2"/>
      <stop offset="1" stop-color="#cdbfa8"/>
    </linearGradient>
    <radialGradient id="l" cx="0.28" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.25 0 0 0 0 0.22 0 0 0 0 0.18 0 0 0 0.10 0"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#g)"/>
  <rect width="800" height="1000" fill="url(#l)"/>
  <rect width="800" height="1000" filter="url(#n)"/>
  <!-- A window of light, not a face. -->
  <rect x="120" y="140" width="560" height="720" rx="18" fill="none" stroke="#17181c" stroke-opacity="0.16" stroke-width="2"/>
  <line x1="120" y1="500" x2="680" y2="500" stroke="#17181c" stroke-opacity="0.12" stroke-width="2"/>
  <line x1="400" y1="140" x2="400" y2="860" stroke="#17181c" stroke-opacity="0.12" stroke-width="2"/>
  <text x="400" y="920" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#17181c" fill-opacity="0.55">Photograph to be added</text>
</svg>
